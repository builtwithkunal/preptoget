<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg"> <defs> <filter id="glow-blue" x="-50%" y="-50%" width="200%" height="200%"> <feGaussianBlur stdDeviation="4" result="blur" /> <feComposite in="SourceGraphic" in2="blur" operator="over" /> </filter> <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%"> <feGaussianBlur stdDeviation="6" result="blur" /> <feComposite in="SourceGraphic" in2="blur" operator="over" /> </filter>

<linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#00f2ff" />
  <stop offset="100%" stop-color="#0072ff" />
</linearGradient>
</defs>

<g stroke="#00d2ff" stroke-width="0.5" opacity="0.2"> <line x1="280" y1="180" x2="320" y2="480" /> <line x1="480" y1="220" x2="120" y2="440" /> <line x1="120" y1="240" x2="480" y2="420" /> <line x1="280" y1="380" x2="320" y2="280" /> </g>

